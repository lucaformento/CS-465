<div class="col-md-4">
  <h2 class="text-center">Edit Trip</h2>
  <div *ngIf="message" class="alert alert-info">{{ message }}</div>
  <form *ngIf="editForm" [formGroup]="editForm" (ngSubmit)="onSubmit()">
    <div class="form-group mb-2">
      <label for="code">Code:</label>
      <input type="text" formControlName="code" id="code" placeholder="GALR210214" class="form-control" readonly
        [class.is-invalid]="submitted && f['code'].errors">
      <div *ngIf="submitted && f['code'].errors" class="invalid-feedback">Code is required</div>
    </div>
    <div class="form-group mb-2">
      <label for="name">Name:</label>
      <input type="text" formControlName="name" id="name" placeholder="Name" class="form-control"
        [class.is-invalid]="submitted && f['name'].errors">
      <div *ngIf="submitted && f['name'].errors" class="invalid-feedback">Name is required</div>
    </div>
    <div class="form-group mb-2">
      <label for="length">Length:</label>
      <input type="text" formControlName="length" id="length" placeholder="3 nights / 4 days" class="form-control"
        [class.is-invalid]="submitted && f['length'].errors">
      <div *ngIf="submitted && f['length'].errors" class="invalid-feedback">Length is required</div>
    </div>
    <div class="form-group mb-2">
      <label for="start">Start:</label>
      <input type="date" formControlName="start" id="start" placeholder="" class="form-control"
        [class.is-invalid]="submitted && f['start'].errors">
      <div *ngIf="submitted && f['start'].errors" class="invalid-feedback">Start is required</div>
    </div>
    <div class="form-group mb-2">
      <label for="resort">Resort:</label>
      <input type="text" formControlName="resort" id="resort" placeholder="Resort Name" class="form-control"
        [class.is-invalid]="submitted && f['resort'].errors">
      <div *ngIf="submitted && f['resort'].errors" class="invalid-feedback">Resort is required</div>
    </div>
    <div class="form-group mb-2">
      <label for="perPerson">Per Person:</label>
      <input type="text" formControlName="perPerson" id="perPerson" placeholder="100.00" class="form-control"
        [class.is-invalid]="submitted && f['perPerson'].errors">
      <div *ngIf="submitted && f['perPerson'].errors" class="invalid-feedback">Per Person is required</div>
    </div>
    <div class="form-group mb-2">
      <label for="image">Image Name:</label>
      <input type="text" formControlName="image" id="image" placeholder="image.jpg" class="form-control"
        [class.is-invalid]="submitted && f['image'].errors">
      <div *ngIf="submitted && f['image'].errors" class="invalid-feedback">Image Name is required</div>
    </div>
    <div class="form-group mb-3">
      <label for="description">Description:</label>
      <textarea formControlName="description" id="description" rows="4" placeholder="Description" class="form-control"
        [class.is-invalid]="submitted && f['description'].errors"></textarea>
      <div *ngIf="submitted && f['description'].errors" class="invalid-feedback">Description is required</div>
    </div>
    <button type="submit" class="btn btn-info">Save</button>
  </form>
</div>
